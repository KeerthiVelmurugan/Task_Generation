<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intern Attempts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef1f5;
            font-family: "Poppins", sans-serif;
        }

        .page-card {
            background: #fff;
            padding: 25px;
            margin: 40px auto;
            width: 90%;
            max-width: 800px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        table thead {
            background: #343a40;
            color: white;
        }

        tbody tr:hover {
            background: #f2f6ff;
        }

        .btn-dark {
            border-radius: 6px;
        }
    </style>
</head>

<body>
     {% include 'sidebar.html' %}

<div class="page-card">

    <h2>Intern Attempts</h2>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">

            <thead class="text-center">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for a in attempts %}
                <tr>
                    <td>{{ a.intern_name }}</td>
                    <td>{{ a.intern_email }}</td>
                    <td class="text-center">
                        <a href="{% url 'view_attempt' a.id %}" class="btn btn-sm btn-dark">
                            View Answers
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-3">
                        No attempts found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
