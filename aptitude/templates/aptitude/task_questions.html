 
<h2 class="test-title">Test Questions</h2>

<form method="post" class="test-form">
    {% csrf_token %}

    {% for q in questions %}
    <div class="question-card">
        <div class="question-header">
            <span class="question-number">Q{{ forloop.counter }}</span>
            <p class="question-text">{{ q.question }}</p>
        </div>

        <div class="input-group">
            <label class="input-label">Your Answer</label>
            <textarea 
                class="input-box"
                name="answer_{{ q.id }}"
                rows="3"
                placeholder="Write your answer..."
            ></textarea>
        </div>

        <div class="input-group">
            <label class="input-label">Your Explanation</label>
            <textarea 
                class="input-box"
                name="explanation_{{ q.id }}"
                rows="3"
                placeholder="Explain why you chose this answer..."
            ></textarea>
        </div>
    </div>
    {% endfor %}

    <div class="submit-center">
        <button class="submit-btn">Submit Test</button>
    </div>
</form>

<style>
    body {
        background: #eef2f7;
        font-family: "Inter", sans-serif !important;
    }

    .test-title {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 30px;
        color: #1f2d3d;
    }

    .test-form {
        max-width: 850px;
        margin: auto;
    }

    .question-card {
        background: white;
        padding: 25px 30px;
        margin-bottom: 25px;
        border-radius: 18px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.06);
        border-left: 6px solid #4a90e2;
    }

    .question-header {
        margin-bottom: 20px;
    }

    .question-number {
        font-size: 20px;
        font-weight: 700;
        color: #4a90e2;
    }

    .question-text {
        font-size: 18px;
        font-weight: 600;
        margin-left: 5px;
        color: #2c3e50;
        display: inline;
    }

    .input-group {
        margin-top: 18px;
    }

    .input-label {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #34495e;
        display: block;
    }

    .input-box {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d0d7e2;
        border-radius: 12px;
        font-size: 15px;
        background: #f9fbfd;
        transition: 0.2s;
    }

    .input-box:focus {
        border-color: #4a90e2;
        background: white;
        outline: none;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .submit-center {
        text-align: center;
        margin-top: 30px;
    }

    .submit-btn {
        background: #4a90e2;
        padding: 12px 40px;
        font-size: 17px;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0px 4px 12px rgba(74,144,226,0.3);
    }

    .submit-btn:hover {
        background: #3b7fc9;
        box-shadow: 0px 5px 15px rgba(74,144,226,0.4);
    }
</style>
