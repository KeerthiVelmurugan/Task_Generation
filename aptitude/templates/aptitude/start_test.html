<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef1f5;
            font-family: "Poppins", sans-serif;
        }

        .test-card {
            background: #fff;
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            margin-top: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    

<div class="test-card">

    <h2>Start Test on <span class="text-primary">{{ session.concept }}</span></h2>

    <form method="post">
        {% csrf_token %}

        <label>Name</label>
        <input name="name" class="form-control" placeholder="Enter your name">

        <label>Email</label>
        <input name="email" class="form-control" placeholder="Enter your email">

        <button class="btn btn-primary mt-4">Start Test</button>
    </form>

</div>

</body>
</html>
