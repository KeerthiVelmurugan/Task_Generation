<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Successful</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f7fa;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card-success {
      background: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
    }

    .card-success h2 {
      color: #28a745;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .card-success p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn-home, .btn-close-tab {
      padding: 10px 25px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
      margin: 5px;
    }

    .btn-home {
      background-color: #0d6efd;
      color: white;
    }

    .btn-home:hover {
      background-color: #0b5ed7;
      color: white;
    }

    .btn-close-tab {
      background-color: #dc3545;
      color: white;
    }

    .btn-close-tab:hover {
      background-color: #c82333;
      color: white;
    }

    .icon-check {
      font-size: 50px;
      color: #28a745;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="card-success">
    <div class="icon-check">✔</div>
    <h2>Submission Successful!</h2>
    <p>Thank you, <strong>{{ attempt.intern_name }}</strong>, for completing the test.</p>
    
   
    <button class="btn-close-tab" onclick="closeOrRedirect()">Close Tab</button>
  </div>

  <script>
    function closeOrRedirect() {
      // Try to close the tab
      window.close();

      // If closing is blocked, redirect to home
     
    }
  </script>

</body>
</html>
