<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo Questions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef1f5;
            font-family: "Poppins", sans-serif;
        }

        .demo-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        h2 {
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        .question-card {
            border-left: 5px solid #0d6efd;
            background: #f8faff;
            border-radius: 10px;
            padding: 15px;
        }

        .question-card b {
            font-size: 16px;
            color: #333;
        }

        .explanation {
            background: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-top: 6px;
            border-left: 3px solid #198754;
        }

        .btn-success {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    

<div class="demo-container">

    <h2>Demo Questions</h2>

    {% for q in demo_qns %}
    <div class="question-card mb-3">

        <b>Q{{ forloop.counter }}: {{ q.question }}</b>

        <div class="explanation">
            <b>Explanation:</b> {{ q.explanation }}
        </div>

    </div>
    {% endfor %}

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-success">Start Test</button>
    </form>

</div>

</body>
</html>
