<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Sidebar styling */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 200px;
      background-color: #007bff;
      color: white;
      padding-top: 20px;
      box-shadow: 3px 0 10px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    .sidebar h3 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 1.3rem;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 6px;
      margin: 6px 8px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #0056b3;
    }
    .sidebar .bottom-link {
      position: absolute;
      bottom: 20px;
      width: 100%;
    }

    /* Main content styling */
    .main-content {
      margin-left: 210px;
      padding: 20px;
      max-width: calc(100vw - 270px);
      overflow-x: hidden;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main-content {
        margin-left: 0;
        padding: 15px;
        max-width: 100%;
      }
    }

    .card {
      border-radius: 12px;
    }

    .btn-success {
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
    }

    #taskList li {
      border: none;
      padding-left: 0;
    }
  </style>
</head>
<body>

  {% include 'sidebar.html' %}

  <div class="main-content container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center fw-bold">
        Add Task
      </div>
      <div class="card-body">

        {% if messages %}
        <div class="mb-3">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} text-center py-2">
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST" id="taskForm" class="p-2 mb-4">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Select Language:</label>
            <select id="languageSelect" name="language" class="form-select" required>
              <option value="">-- Select Language --</option>
              {% for lang in languages %}
              <option value="{{ lang.id }}">{{ lang.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Select Concept:</label>
            <select id="conceptSelect" name="concept" class="form-select" required>
              <option value="">-- Select Concept --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Task Description:</label>
            <textarea
              name="description"
              rows="3"
              class="form-control"
              placeholder="Enter detailed task description"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn btn-success w-100">Add Task</button>
        </form>

        <h5 class="text-center mb-3">Existing Tasks</h5>
        <ul id="taskList" class="list-unstyled">
          <li class="text-muted text-center">Select a concept to view tasks.</li>
        </ul>

      </div>
    </div>
  </div>

  <script>
document.addEventListener("DOMContentLoaded", function() {
    const langSelect = document.getElementById("languageSelect");
    const conceptSelect = document.getElementById("conceptSelect");
    const taskList = document.getElementById("taskList");

    langSelect.addEventListener("change", function() {
        const langId = this.value;
        conceptSelect.innerHTML = '<option value="">-- Select Concept --</option>';
        taskList.innerHTML = '<li class="text-muted text-center">Select a concept to view tasks.</li>';

        if (langId) {
            fetch(`/get-concepts/${langId}/`)
                .then(res => res.json())
                .then(data => {
                    data.concepts.forEach(c => {
                        conceptSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    });
                });
        }
    });

    conceptSelect.addEventListener("change", function() {
    const conceptId = this.value;
    taskList.innerHTML = '';

    if (conceptId) {
        fetch(`/get-tasks/${conceptId}/`)
            .then(res => res.json())
            .then(data => {
                if (data.tasks.length > 0) {
                    // Show total tasks
                    taskList.innerHTML += `<li class="fw-bold mb-2">Total Tasks: ${data.tasks.length}</li>`;

                    data.tasks.forEach(t => {
                        taskList.innerHTML += `
                        <li class="d-flex justify-content-between align-items-center mb-2">
                            <span>• ${t.description}</span><br><br>
                            <a href="/delete-task/${t.id}/" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this task?')">Delete</a>
                        </li>`;
                    });
                } else {
                    taskList.innerHTML = '<li class="text-muted text-center">No tasks found for this concept.</li>';
                }
            });
    }
});

});
</script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
