<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      width: 380px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    form p {
      margin: 10px 0;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    button {
      width: 100%;
      background: #6a11cb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #2575fc;
    }
    .link {
      text-align: center;
      margin-top: 15px;
    }
    .link a {
      text-decoration: none;
      color: #6a11cb;
      font-weight: bold;
    }
    .forgot {
      text-align: right;
      margin-top: 8px;
    }
    .forgot a {
      text-decoration: none;
      color: #6a11cb;
      font-size: 0.9rem;
    }
    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="forgot">
        <a href="{% url 'password_reset' %}">Forgot Password?</a>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="link">
      Don’t have an account? <a href="{% url 'signup_view' %}">Signup</a>
    </div>
  </div>
</body>
</html>
