<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Concept</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Sidebar styling */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 200px; /* reduced width */
      background-color: #007bff;
      color: white;
      padding-top: 20px;
      box-shadow: 3px 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .sidebar h3 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 1.3rem;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 6px;
      margin: 6px 8px;
      transition: 0.3s;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #0056b3;
    }

    .sidebar .bottom-link {
      position: absolute;
      bottom: 20px;
      width: 100%;
    }

    /* Main content */
    .main-content {
      margin-left: 210px; /* slightly more than sidebar */
      padding: 20px;
      max-width: calc(100vw - 310px); /* prevent horizontal scrollbar */
      overflow-x: hidden;
    }

    /* Card styling */
    .card {
      border-radius: 12px;
    }

    .btn-success {
      font-weight: 600;
    }

    .list-group-item span {
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main-content {
        margin-left: 0;
        padding: 15px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
{% include 'sidebar.html' %}

<div class="main-content container mt-5">

  <!-- Form Row -->
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center fw-bold fs-5">
          Add Concept
        </div>
        <div class="card-body">

          {% if messages %}
          <div class="mb-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-center py-2">
              {{ message }}
            </div>
            {% endfor %}
          </div>
          {% endif %}

          <!-- Language Selection (GET for filtering) -->
          <form method="get" class="mb-3">
            <label class="form-label" for="language-select">Select Language:</label>
            <select id="language-select" name="language" class="form-select" onchange="this.form.submit()">
              <option value="">-- Select Language --</option>
              {% for lang in languages %}
              <option value="{{ lang.id }}" {% if lang.id|stringformat:"s" == selected_lang_id %}selected{% endif %}>
                {{ lang.name }}
              </option>
              {% endfor %}
            </select>
          </form>

          <!-- Add Concept Form (POST) -->
          <form method="POST" class="p-3">
            {% csrf_token %}
            <input type="hidden" name="language" value="{{ selected_lang_id }}">
            <div class="mb-3">
              <label class="form-label" for="concept-name">Concept Name:</label>
              <input type="text" id="concept-name" name="name" class="form-control" placeholder="Enter concept name" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Add Concept</button>
          </form>

        </div>
      </div>
    </div>
  </div> <!-- close first row -->

  <!-- Concepts Row (Below Form) -->
  {% if concepts %}
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm mt-4">
        <div class="card-header bg-secondary text-white text-center fw-bold fs-5">
          Existing Concepts
        </div>
        <div class="card-body">
          <div class="row">
            {% for concept in concepts %}
            <div class="col-md-6 mb-2 d-flex justify-content-between align-items-center">
              • {{ concept.name }}
              <a href="{% url 'delete_concept' concept.id %}" 
                 class="btn btn-sm btn-danger"
                 onclick="return confirm('Are you sure you want to delete this concept?');">
                 Delete
              </a>
            </div>
            {% empty %}
            <div class="col-12 text-muted text-center">
              No concepts added yet.
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endif %}

</div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
