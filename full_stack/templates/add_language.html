<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Language</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Sidebar styling */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 200px;
      background-color: #007bff;
      color: white;
      padding-top: 20px;
      box-shadow: 3px 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .sidebar h3 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 1.3rem;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 6px;
      margin: 6px 8px;
      transition: 0.3s;
    }

    .sidebar a:hover, .sidebar a.active {
      background-color: #0056b3;
    }

    .sidebar .bottom-link {
      position: absolute;
      bottom: 20px;
      width: 100%;
    }

    /* Main content */
    .main-content {
      margin-left: 210px;
      padding: 20px;
      max-width: calc(100vw - 210px);
      overflow-x: hidden;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .main-content {
        margin-left: 0;
        padding: 15px;
        max-width: 100%;
      }
    }

    .card {
      border-radius: 12px;
    }

    .btn-success {
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
    }

    .list-group-item {
      border-radius: 6px;
      margin-bottom: 5px;
      transition: all 0.2s;
    }

    .list-group-item:hover {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  {% include 'sidebar.html' %}

  <div class="main-content container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center fw-bold fs-5">
            Add Language
          </div>
          <div class="card-body">

            {% if messages %}
            <div class="mb-3">
              {% for message in messages %}
              <div class="alert alert-{{ message.tags }} text-center py-2">
                {{ message }}
              </div>
              {% endfor %}
            </div>
            {% endif %}

            <!-- Add Language Form -->
            <form method="POST" class="p-3 mb-4">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label" for="language-name">Language Name:</label>
                <input
                  type="text"
                  id="language-name"
                  name="name"
                  class="form-control"
                  placeholder="Enter language name (e.g., Python, JavaScript)"
                  required
                />
              </div>

              <button type="submit" class="btn btn-success w-100 py-2">
                Add Language
              </button>
            </form>

            <!-- Existing Languages -->
            <!-- Existing Languages -->
<h5 class="mb-3">Existing Languages</h5>
<ul class="list-unstyled">
  {% for lang in languages %}
  <li class="col-md-6 mb-2 d-flex justify-content-between align-items-center">
    • {{ lang.name }}
    <a href="{% url 'delete_language' lang.id %}" 
       class="btn btn-sm btn-danger"
       onclick="return confirm('Are you sure you want to delete this language?');">
       Delete
    </a>
  </li>
  {% empty %}
  <li class="text-muted">
    No languages added yet.
  </li>
  {% endfor %}
</ul>


          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
