{% load static %}
{% include 'sidebar.html' %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Daily Tasks</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Poppins", sans-serif;
      }

      /* ✅ Adjust margin so content appears beside sidebar */
      .main-container {
        margin-left: 260px; /* match sidebar width */
        padding: 30px 20px;
        max-width: 900px;
      }

      .card {
        border-radius: 15px;
      }

      .card-header {
        border-top-left-radius: 15px !important;
        border-top-right-radius: 15px !important;
        font-weight: 600;
        font-size: 1.2rem;
      }

      .intern-list {
        max-height: 350px;
        overflow-y: auto;
        padding: 10px;
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 10px;
      }

      .btn-custom {
        font-size: 1rem;
        font-weight: 600;
        padding: 10px;
      }

      .intern-col {
        column-count: 2;
        column-gap: 1.5rem;
      }

      @media (max-width: 992px) {
        .main-container {
          margin-left: 0; /* remove margin when sidebar collapses */
          padding: 20px;
        }
        .intern-col {
          column-count: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="main-container">
      <div class="card shadow p-4">
        <h4 class="text-center mb-4">Start Daily Tasks</h4>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-bold">Select Language</label>
            <select name="language" id="languageSelect" class="form-select" required>
              <option value="">-- Select Language --</option>
              {% for lang in languages %}
              <option value="{{ lang.id }}">{{ lang.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Select Concept (Daily Tasks)</label>
            <select name="concept" id="conceptSelect" class="form-select" required>
              <option value="">-- Select Concept --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Select Interns</label><br />
            <div class="intern-list intern-col">
              {% for intern in interns %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="interns" value="{{ intern.id }}">
                <label class="form-check-label">{{ intern.name }} ({{ intern.email }})</label>
              </div>
              {% endfor %}
            </div>
          </div>

          <button class="btn btn-success w-100 btn-custom">Start Daily Tasks</button>
        </form>
      </div>
    </div>

    <script>
      document.getElementById("languageSelect").addEventListener("change", function () {
        const langId = this.value;
        const conceptSelect = document.getElementById("conceptSelect");
        conceptSelect.innerHTML = '<option value="">-- Select Concept --</option>';
        if (langId) {
          fetch(`/get-concepts/${langId}/`)
            .then((res) => res.json())
            .then((data) => {
              data.concepts.forEach((c) => {
                conceptSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
              });
            });
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
