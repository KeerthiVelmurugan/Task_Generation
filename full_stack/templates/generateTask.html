{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Task Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: "Poppins", sans-serif;
        }
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
        }
        .card-header {
            background: #007bff;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

{% include 'sidebar.html' %}

<div class="main-content">
    <div class="container">
        <div class="card">
            <div class="card-header">🎯 Random Task Generator</div>

            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <!-- LANGUAGE -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Language(s)</label>
                        <select id="id_languages" class="form-select" multiple>
                            {% for lang in form.languages.field.queryset %}
                                <option value="{{ lang.id }}">{{ lang.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- CONCEPT -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Concept(s)</label>
                        <select id="id_concepts" class="form-select" multiple>
                            <!-- Loaded via AJAX -->
                        </select>
                    </div>

                    <!-- TASK COUNT -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Number of Tasks</label>
                        {{ form.number_of_tasks }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Generate Tasks
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function () {

    $("#id_languages").on("change", function () {

        let languageIds = $(this).val();
        console.log("Selected languages:", languageIds);

        $.ajax({
            url: "{% url 'get_concept' %}",
            type: "GET",
            traditional: true,   // ✅ THIS IS THE FIX
            dataType: "json",
            data: {
                language_ids: languageIds
            },
            success: function (data) {
                console.log("Concepts:", data);

                let conceptSelect = $("#id_concepts");
                conceptSelect.empty();

                if (data.length === 0) {
                    conceptSelect.append('<option disabled>No concepts found</option>');
                }

                data.forEach(function (concept) {
                    conceptSelect.append(
                        `<option value="${concept.id}">${concept.name}</option>`
                    );
                });
            },
            error: function (xhr) {
                console.error("AJAX ERROR:", xhr.responseText);
            }
        });

    });

});
</script>

</body>
</html>
